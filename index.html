      @font-face { font-family: 'Cormorant'; font-display: block; font-weight: 600; src: url('./fonts/cormorant-garamond-latin-600-normal.woff2') format('woff2'); }
      /* Nanum Myeongjo (SIL Open Font License 1.1, fonts/NanumMyeongjo-OFL.txt): Korean subset for the translated text */
      @font-face { font-family: 'Nanum Myeongjo'; font-display: block; font-weight: 400; src: url('./fonts/nanum-myeongjo-ko-400-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Nanum Myeongjo'; font-display: block; font-weight: 700; src: url('./fonts/nanum-myeongjo-ko-700-normal.woff2') format('woff2'); }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #07060f;
        color: #24323a;
        font: 15px/1.4 Cormorant, 'Nanum Myeongjo', Georgia, 'Times New Roman', serif;
        user-select: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #loading,
      #start {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        letter-spacing: 0.06em;
        pointer-events: none;
      }
      #loading {
        background: #07060f;
        color: #b9b2d6;
        font: italic 20px Cormorant, 'Nanum Myeongjo', Georgia, serif;
        letter-spacing: 0.3em;
      }
      #start {
        display: none;
        align-content: end;
        padding-bottom: 9vh;
        color: #fff;
        text-shadow: 0 1px 10px rgba(20, 50, 80, 0.55);
      }
      #start b {
        display: block;
        font-size: 19px;
        font-weight: normal;
      }
      #start span {
        display: block;
        margin-top: 4px;
        font-size: 13px;
        opacity: 0.85;
        text-align: center;
      }
      #note {
        position: fixed;
        top: 7vh;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 19px;
        letter-spacing: 0.06em;
        color: #fff;
        text-shadow: 0 1px 10px rgba(20, 50, 80, 0.55);
        opacity: 0;
        transition: opacity 0.6s;
        pointer-events: none;
      }
      #note.on {
        opacity: 1;
        transition: opacity 0.15s;
      }
      .ready:not(.playing):not(.menu) #start {
        display: grid;
      }
      .menu #note {
        display: none;
      }

      /* ---- the title: a film's opening, over the valley in the wind ---- */
      #title {
        position: fixed;
        inset: 0;
        display: none;
        color: #f4ecdc;
        pointer-events: auto;
        cursor: default;
      }
      .menu #title,
      .leaving #title {
        display: block;
      }
      .leaving #title {
        pointer-events: none;
      }
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        height: 11vh;
        background: #020106;
        transition: transform 1.6s cubic-bezier(0.6, 0, 0.2, 1);
      }
      .bar.top { top: 0; }
      .bar.bottom { bottom: 0; }
      .leaving .bar.top { transform: translateY(-100%); }
      .leaving .bar.bottom { transform: translateY(100%); }
      #shade {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 60% 75% at 12% 45%, rgba(6, 4, 22, 0.7), rgba(6, 4, 22, 0) 72%);
        pointer-events: none;
        transition: opacity 1.2s;
      }
      .leaving #shade { opacity: 0; }
      #veil {
        position: absolute;
        inset: 0;
        background: #020106;
        animation: lift 4.5s ease-out forwards;
        pointer-events: none;
      }
      @keyframes lift { from { opacity: 1; } 35% { opacity: 1; } to { opacity: 0; } }
      #mark {
        position: absolute;
        left: 7vw;
        top: 17vh;
        display: flex;
        gap: 2.4vw;
        align-items: flex-start;
        transition: opacity 1.2s, transform 1.6s;
        text-shadow: 0 0 24px rgba(10, 6, 30, 0.75), 0 0 2px rgba(10, 6, 30, 0.6);
      }
      .leaving #mark { opacity: 0; transform: translateY(-2vh); }
      #kanji {
        writing-mode: vertical-rl;
        font: 13vh/1 'Yuji Syuku', serif;
        letter-spacing: 0.08em;
        color: #fff6e4;
        opacity: 0;
        filter: blur(6px);
        animation: ink 3.2s 1.2s ease-out forwards;
      }
      @keyframes ink { to { opacity: 0.96; filter: blur(0); } }
      #words {
        padding-top: 1.8vh;
        opacity: 0;
        animation: rise 2.6s 2.6s ease-out forwards;
      }
      @keyframes rise { from { opacity: 0; transform: translateY(1vh); } to { opacity: 1; transform: none; } }
      #words h1 {
        margin: 0;
        font: 600 5.2vh/1 Cormorant, 'Nanum Myeongjo', serif;
        letter-spacing: 0.55em;
        color: #fff3dc;
      }
      #words p {
        margin: 1.4vh 0 0;
        font: italic 2.3vh/1.3 Cormorant, 'Nanum Myeongjo', serif;
        letter-spacing: 0.12em;
        color: #e6dbf6;
      }
      #words .rule {
        width: 15vw;
        height: 2px;
        margin-top: 2.2vh;
        background: linear-gradient(90deg, rgba(240, 200, 120, 0.95), rgba(240, 200, 120, 0));
      }
      #press {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 15vh;
        text-align: center;
        font: italic 2.4vh Cormorant, 'Nanum Myeongjo', serif;
        letter-spacing: 0.4em;
        color: #f2e8d6;
        text-shadow: 0 0 14px rgba(10, 6, 30, 0.9);
        opacity: 0;
        animation: rise 2s 4.2s ease-out forwards, breathe 3.4s 6.2s ease-in-out infinite;
      }
      @keyframes breathe { 50% { opacity: 0.4; } }
      .chosen #press { display: none; }
      .chosen #hint { display: block; }
      #items {
        position: absolute;
        left: 7vw;
        bottom: 16vh;
        margin: 0;
        padding: 0;
        list-style: none;
        display: none;
        text-shadow: 0 0 16px rgba(10, 6, 30, 0.9);
      }
      .chosen #items { display: block; animation: rise 1.2s ease-out both; }
      .leaving #items { opacity: 0; transition: opacity 0.6s; }
      #items li {
        position: relative;
        padding: 0.7vh 0 0.7vh 2.4vw;
        font: 3vh/1.2 Cormorant, 'Nanum Myeongjo', serif;
        letter-spacing: 0.22em;
        color: rgba(244, 236, 220, 0.62);
        cursor: pointer;
        transition: color 0.3s, transform 0.4s;
      }
      #items li small {
        font-style: italic;
        letter-spacing: 0.12em;
        color: rgba(230, 210, 170, 0.85);
        margin-left: 0.8em;
      }
      #items li::before {
        /* a stroke of gold ink beside the one chosen */
        content: '';
        position: absolute;
        left: 0;
        top: 50%;
        width: 1.6vw;
        height: 3px;
        border-radius: 3px;
        background: linear-gradient(90deg, rgba(240, 196, 110, 0), rgba(240, 196, 110, 1));
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.35s;
      }
      #items li.on {
        color: #fff8ea;
        transform: translateX(0.5vw);
      }
      #items li.on::before { transform: scaleX(1); }
      #hint {
        display: none;
        position: absolute;
        right: 5vw;
        bottom: 4vh;
        font: italic 1.7vh Cormorant, 'Nanum Myeongjo', serif;
        letter-spacing: 0.14em;
        color: rgba(220, 210, 235, 0.55);
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="start">
      <div>
        <b>클릭해서 걷기</b>
        <span>W A S D · Shift 달리기 · F 칼 뽑기·넣기 · V 1인칭 · T 시간대</span>
      </div>
    </div>
    <div id="note"></div>
    <div id="title">
      <div id="shade"></div>
      <div class="bar top"></div>
      <div class="bar bottom"></div>
      <div id="mark">
        <div id="kanji">畏敬</div>
        <div id="words">
          <h1>경외</h1>
          <p>하늘 아래를 걷는 방랑</p>
          <p>Fable을 기리며</p>
          <div class="rule"></div>
        </div>
      </div>
      <div id="press">아무 키나 누르세요</div>
      <ul id="items">
        <li data-item="begin" class="on">산책 시작</li>
        <li data-item="hour">시간대<small id="hourName">황금빛 시간</small></li>
        <li data-item="brush">붓터치<small id="brushName">켜짐</small></li>
      </ul>
      <div id="hint">↑ ↓ 선택 · ← → 변경 · Enter</div>
      <div id="veil"></div>
    </div>
    <div id="loading">경외</div>
    <script type="module" src="./src/valley/main.js"></script>
  </body>
</html>
